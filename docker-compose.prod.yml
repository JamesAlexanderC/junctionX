# Production stack: only the Caddy frontend is published on the host.
# Use the scripts: scripts/bin/docker-build, docker-up, docker-down, ...
name: saldo-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "0"
      DATA_DIR: data
    volumes:
      # CSVs for `manage.py load_data`; read-only, never baked into the image.
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # ":80" = plain HTTP; a domain name turns on automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Caddy's certificates and state; keep them across rebuilds.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
